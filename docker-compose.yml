# Optional Docker Compose configuration for Personal Life OS
# Note: Docker is completely optional. Default operation runs directly on your machine via .\scripts\start.ps1.

services:
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./exports:/app/exports
      - ./backups:/app/backups
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/personal_life_os.db
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    command: >
      sh -c "npm install && npm run dev"

